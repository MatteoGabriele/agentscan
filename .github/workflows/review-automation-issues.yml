name: Review Automation Reports

# 👍 / 👎 reactions emit no webhook event, so the open reports are polled on a
# schedule rather than reacted to.
on:
  schedule:
    # Half past the hour, so this does not queue behind the hourly scan.
    - cron: '30 * * * *'
    # Daily digest. 14:45 UTC is the widest window where Europe and both US
    # coasts are awake
    - cron: '45 14 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Review only this issue number (leave empty for all open reports)'
        required: false
        type: string
      digest:
        description: 'Also post the pending-report digest to Discord'
        required: false
        default: false
        type: boolean

# Two runs of this workflow would stage the same approvals twice, so they queue.
# The hourly scan is no longer part of the group: nothing here pushes to main.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # The Rosen Association
  REVIEWERS: |
    MatteoGabriele
    huang-julien
    danielroe
    gameroman
    sheremet-va
    ematipico
    graphieros
    TheAlexLichter
    orbisk
    bluwy
    trueberryless
    bnb

  MIN_APPROVALS: '4'
  MIN_REJECTIONS: '2'

  DECISIONS_FILE: ${{ github.workspace }}/automation-decisions.json

  # main is protected, so approvals land on a branch and are merged by hand.
  # One branch per run, cut from main's tip and left behind once its pull
  # request is merged, so no run has to reconcile with an earlier one.
  BRANCH: automation/approvals-${{ github.run_id }}

jobs:
  review:
    if: github.repository == 'MatteoGabriele/agentscan'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Approvals are finalized against main, so a workflow_dispatch from
          # another ref cannot run a different version of the scripts.
          ref: main
          # Only the scripts are needed here: the entries are staged through the
          # API, so nothing is committed or pushed from the runner and no token
          # is left in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      # Installed without lifecycle scripts, so nothing from the dependency tree
      # runs next to a token that can write to the repository.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Counts the reactions, commits the approved entries to $BRANCH through the
      # API, and opens the pull request for it. Issues are left alone until all
      # of that has landed.
      - name: Count reactions and stage approvals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by the script, never interpolated into a command.
          ISSUE: ${{ inputs.issue }}
        run: >
          pnpm exec tsx scripts/review-automation-issues.ts
          --mode=decide
          --decisions="$DECISIONS_FILE"

      # Only now that the entries are safely on the branch: comment, relabel
      # and close.
      - name: Close reviewed issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          pnpm exec tsx scripts/review-automation-issues.ts
          --mode=finalize
          --decisions="$DECISIONS_FILE"

      # Settled reports only: a pending one never reaches the decisions file, so
      # the channel hears about a report twice at most — once when it opens, and
      # once when it is ruled on.
      - name: Announce outcomes on Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_REPORT: ${{ secrets.OSS_GUILD_REPORTS_DISCORD_WEBHOOK }}
        run: >
          pnpm exec tsx scripts/notify-report-discord.ts
          --event=decided
          --decisions="$DECISIONS_FILE"

  # A daily digest
  digest:
    needs: review
    if: >-
      ${{ !cancelled() &&
      github.repository == 'MatteoGabriele/agentscan' &&
      (github.event.schedule == '45 14 * * *' || inputs.digest) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes, so the checkout keeps no token at all.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Post the pending report digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_REPORT: ${{ secrets.OSS_GUILD_REPORTS_DISCORD_WEBHOOK }}
        run: pnpm exec tsx scripts/notify-report-discord.ts --event=digest
