name: Review Automation Reports

# 👍 / 👎 reactions emit no webhook event, so the open reports are polled on a
# schedule rather than reacted to.
on:
  schedule:
    # Half past the hour, so this does not queue behind the hourly scan.
    - cron: '30 * * * *'
    # Daily digest. 14:45 UTC is the widest window where Europe and both US
    # coasts are awake
    - cron: '45 14 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Review only this issue number (leave empty for all open reports)'
        required: false
        type: string
      digest:
        description: 'Also post the pending-report digest to Discord'
        required: false
        default: false
        type: boolean

# Two runs would comment on and close the same reports twice, so they queue.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'MatteoGabriele/agentscan'
    runs-on: ubuntu-latest
    # Issues are the only thing this writes. Rejected reports are closed here;
    # approved ones are relabelled automation:approved and left open, because
    # their list entries are appended by `pnpm publish:automations`, run by a
    # maintainer — the commit that carries them is what closes the reports. So
    # nothing here needs write access to the repository.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Approvals are counted against the roster in lib/reviewers, so a
          # workflow_dispatch from another ref cannot vote itself a new one.
          ref: main
          # Nothing pushes, so the checkout keeps no token at all.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      # Installed without lifecycle scripts, so nothing from the dependency tree
      # runs next to the token.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Counts the reactions, then comments on and relabels whatever has
      # settled, closing everything but the approvals still waiting on a list
      # update. The outcomes go to automation-decisions.json for the next step,
      # which both scripts default to; it stays on the runner.
      - name: Review the open reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by the script, never interpolated into a command.
          ISSUE: ${{ inputs.issue }}
        run: pnpm review:automations

      # Settled reports only: a pending one never reaches the decisions file, so
      # the channel hears about a report twice at most — once when it opens, and
      # once when it is ruled on.
      - name: Announce outcomes on Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_REPORT: ${{ secrets.OSS_GUILD_REPORTS_DISCORD_WEBHOOK }}
        run: pnpm exec tsx scripts/notify-report-discord.ts --event=decided

  # A daily digest
  digest:
    needs: review
    if: >-
      ${{ !cancelled() &&
      github.repository == 'MatteoGabriele/agentscan' &&
      (github.event.schedule == '45 14 * * *' || inputs.digest) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Post the pending report digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_REPORT: ${{ secrets.OSS_GUILD_REPORTS_DISCORD_WEBHOOK }}
        run: pnpm exec tsx scripts/notify-report-discord.ts --event=digest
