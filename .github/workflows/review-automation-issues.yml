name: Review Automation Reports

# 👍 / 👎 reactions emit no webhook event, so the open reports are polled on a
# schedule rather than reacted to.
on:
  schedule:
    # Half past the hour, so this does not queue behind the hourly scan.
    - cron: '30 * * * *'
    # Daily digest. 14:45 UTC is the widest window where Europe and both US
    # coasts are awake
    - cron: '45 14 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Review only this issue number (leave empty for all open reports)'
        required: false
        type: string
      digest:
        description: 'Also post the pending-report digest to Discord'
        required: false
        default: false
        type: boolean

# The hourly scan pushes to main, and this run rebases the approvals branch onto
# it, so the two take turns instead of racing.
concurrency:
  group: scan-results
  cancel-in-progress: false

env:
  # The Rosen Association
  REVIEWERS: |
    MatteoGabriele
    huang-julien
    danielroe
    gameroman
    sheremet-va
    ematipico
    graphieros
    TheAlexLichter
    orbisk
    bluwy
    trueberryless
    bnb

  MIN_APPROVALS: '4'
  MIN_REJECTIONS: '2'

  DECISIONS_FILE: ${{ github.workspace }}/automation-decisions.json

  # main is protected, so approvals land on this branch and are merged by hand.
  # One long-lived branch, one open PR: later approvals are appended to it.
  BRANCH: automation/approved-reports

jobs:
  review:
    if: github.repository == 'MatteoGabriele/agentscan'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Approvals are finalized against main, so a workflow_dispatch from
          # another ref cannot land entries anywhere else.
          ref: main
          # Full history, so the approvals branch can be rebased onto main.
          fetch-depth: 0
          # No token left in .git/config. The steps below hand one to the git
          # commands that need it, and to those only.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      # Installed before the branch is checked out and without lifecycle
      # scripts, so nothing from the dependency tree runs next to a token or a
      # pushable branch.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Approvals are staged on $BRANCH. When its PR is still open the branch is
      # checked out and brought up to date with main first, so `add:automation`
      # dedupes against the entries waiting in that PR as well as the ones on
      # main, and the new approvals are appended to the same PR.
      - name: Check out the approvals branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Credentials per command, so they outlive none of them.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git_auth() {
            git -c http.extraheader="AUTHORIZATION: basic $auth" "$@"
          }

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$pr" ]; then
            echo "Reusing the open PR #$pr on $BRANCH"
            git_auth fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::$BRANCH does not rebase cleanly onto main. Resolve PR #$pr by hand; issues stay open and the next run retries."
              exit 1
            fi
          else
            echo "No open PR on $BRANCH — starting it from main"
            git checkout -B "$BRANCH" origin/main
          fi

          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"

      - name: Count reactions and stage approvals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_INPUT: ${{ inputs.issue }}
        run: |
          args=()

          if [ -n "$ISSUE_INPUT" ]; then
            case "$ISSUE_INPUT" in
              *[!0-9]*)
                echo "::error::issue input must be an issue number, got: $ISSUE_INPUT"
                exit 1
                ;;
            esac
            args+=("--issue=$ISSUE_INPUT")
          fi

          pnpm exec tsx scripts/review-automation-issues.ts \
            --mode=decide \
            --decisions="$DECISIONS_FILE" \
            "${args[@]}"

      - name: Commit approvals and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git_auth() {
            git -c http.extraheader="AUTHORIZATION: basic $auth" "$@"
          }

          git add data/verified-automations-list.json

          if git diff --cached --quiet; then
            echo "No new automations to commit"
            exit 0
          fi

          count="$(git diff --cached --numstat -- data/verified-automations-list.json | awk '{print $1}')"
          git commit -m "chore: add approved automation reports"

          if [ -n "$PR_NUMBER" ]; then
            # The branch was rebased onto main above, so the push has to be
            # forced — with a lease, so anything pushed to the open PR since the
            # fetch stops it instead of being overwritten.
            force='--force-with-lease'
          else
            # No open PR: the branch was re-created from main, so whatever a
            # closed or merged PR left behind on the remote is replaced.
            force='--force'
          fi

          pushed=''

          for attempt in 1 2 3; do
            if git_auth push $force origin "HEAD:refs/heads/$BRANCH"; then
              pushed='yes'
              echo "Pushed on attempt $attempt ($count line(s) added)"
              break
            fi

            # Someone pushed to the PR in the meantime; replay on top of it.
            git_auth fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"

            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              break
            fi

            # The remote is known now, so the retry can hold a lease on it.
            force='--force-with-lease'

            sleep $((attempt * 5))
          done

          if [ -z "$pushed" ]; then
            echo "::error::Could not push the approved automation entries to $BRANCH; issues were left open and will be retried next run."
            exit 1
          fi

          if [ -n "$PR_NUMBER" ]; then
            echo "Appended to the open PR #$PR_NUMBER"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: add approved automation reports" \
            --body "Automation reports that reached the required approvals, staged by [the review workflow](https://github.com/$GITHUB_REPOSITORY/actions/workflows/review-automation-issues.yml). Later approvals are appended to this PR until it is merged."

      # Only now that the entries are safely on the branch: comment, relabel
      # and close.
      - name: Close reviewed issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          pnpm exec tsx scripts/review-automation-issues.ts
          --mode=finalize
          --decisions="$DECISIONS_FILE"

      # Settled reports only: a pending one never reaches the decisions file, so
      # the channel hears about a report twice at most — once when it opens, and
      # once when it is ruled on.
      - name: Announce outcomes on Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_REPORT: ${{ secrets.OSS_GUILD_REPORTS_DISCORD_WEBHOOK }}
        run: >
          pnpm exec tsx scripts/notify-report-discord.ts
          --event=decided
          --decisions="$DECISIONS_FILE"

  # A daily digest
  digest:
    needs: review
    if: >-
      ${{ !cancelled() &&
      github.repository == 'MatteoGabriele/agentscan' &&
      (github.event.schedule == '45 14 * * *' || inputs.digest) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes, so the checkout keeps no token at all.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Post the pending report digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_REPORT: ${{ secrets.OSS_GUILD_REPORTS_DISCORD_WEBHOOK }}
        run: pnpm exec tsx scripts/notify-report-discord.ts --event=digest
