name: Typosquat

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - id: guard
        uses: MatteoGabriele/typosquat@35001a02ccc57ce4629df709f97dee74045bffdc
