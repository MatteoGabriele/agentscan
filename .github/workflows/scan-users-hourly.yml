name: Hourly User Scan

on:
  workflow_dispatch: # Allow manual trigger

# Both scans read, merge and rewrite data/daily-scan-results.json, so they have
# to take turns: a queued run reads what the previous one already wrote.
concurrency:
  group: daily-scan-results
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'MatteoGabriele/agentscan'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run user scan
        env:
          # Separate account, so scans draw from their own rate limit bucket.
          NUXT_GITHUB_TOKEN_ANASTELLINE: ${{ secrets.NUXT_GITHUB_TOKEN_ANASTELLINE }}
          PR_HASH_SECRET: ${{ secrets.PR_HASH_SECRET }}
        run: >
          pnpm exec tsx scripts/scan-users.ts
          --output=hourly-scan-results.txt
          --max-scans=25
          --window-output=hourly-window-scan-results.txt
          --window-max-scans=30
          --daily-output=daily-scan-results.json

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Staged-diff check, so the first run picks up the still-untracked files.
          git add data/hourly-scan-results.txt data/hourly-window-scan-results.txt data/daily-scan-results.json

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore: hourly user scan - $(date -u +'%Y-%m-%dT%H:00Z')"
            git fetch origin main
            git merge --no-edit origin/main
            git push
          fi
